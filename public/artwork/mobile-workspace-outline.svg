<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" width="960" height="780" data-mode="outline" role="img" aria-labelledby="title description">
  <title id="title">Mobile application workspace</title>
  <desc id="description">An original illustration connecting a mobile application, retail checkout, API services, and a printed receipt.</desc>
  <defs>
    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#343d28"/><stop offset="1" stop-color="#1b2017"/></linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34382c"/><stop offset="1" stop-color="#191d15"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffa15d"/><stop offset="1" stop-color="#ee6527"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#283020"/><stop offset="1" stop-color="#141a11"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#b7be88" stop-opacity=".10"/><stop offset="1" stop-color="#b7be88" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-40%" y="-30%" width="180%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000" flood-opacity=".28"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a4ad85" stroke-opacity=".12" stroke-width=".7"/></pattern>
    <clipPath id="platform-clip"><path d="M104 574 466 394 868 595 506 775Z"/></clipPath>
  </defs>
  <style>
    .plane{fill:url(#platform);stroke:#535e40;stroke-width:1.3}.edge{fill:#171c13;stroke:#465136;stroke-width:1.3}.frame{fill:url(#device);stroke:#969983;stroke-width:1.4}.screen{fill:url(#screen);stroke:#596343;stroke-width:1}.panel{fill:#20271b;stroke:#697452;stroke-width:1.2}.inset{fill:#151b12;stroke:#414d32;stroke-width:1}.accent{fill:url(#orange);stroke:#ffaf74;stroke-width:.8}.sage{fill:#83945f;stroke:#a6b982;stroke-width:.8}.cream{fill:#e3ddc8;stroke:#fff2db;stroke-width:.8}.muted{fill:#566047}.line{fill:none;stroke:#788463;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:#ef863f;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.fine{fill:none;stroke:#83946c;stroke-width:.8;stroke-opacity:.3}.paper{fill:#e5dfcd;stroke:#b8baa0;stroke-width:1.2}.paper-ink{fill:#5d664b}.paper-line{fill:none;stroke:#9b9f85;stroke-width:1}.label{fill:#cbcdb4;font:500 12px ui-sans-serif,system-ui,sans-serif;letter-spacing:1.6px}.small{fill:#a6b08f;font:10px ui-sans-serif,system-ui,sans-serif;letter-spacing:1px}.dark-label{fill:#454f37;font:600 12px ui-sans-serif,system-ui,sans-serif;letter-spacing:1.4px}.shadow{filter:url(#shadow)}
    [data-mode="outline"] .plane,[data-mode="outline"] .edge,[data-mode="outline"] .frame,[data-mode="outline"] .screen,[data-mode="outline"] .panel,[data-mode="outline"] .inset,[data-mode="outline"] .accent,[data-mode="outline"] .sage,[data-mode="outline"] .cream,[data-mode="outline"] .muted,[data-mode="outline"] .paper,[data-mode="outline"] .paper-ink{fill:#11170f;stroke:#b5c58a;stroke-width:1.4}
    [data-mode="outline"] .line,[data-mode="outline"] .route,[data-mode="outline"] .paper-line{stroke:#b5c58a;stroke-width:1.4}[data-mode="outline"] .route{stroke:#ffad71}[data-mode="outline"] .label,[data-mode="outline"] .small,[data-mode="outline"] .dark-label{fill:#b5c58a}[data-mode="outline"] .shadow{filter:none}[data-mode="outline"] .ambient{opacity:0}
  </style>
  <ellipse class="ambient" cx="490" cy="451" rx="415" ry="314" fill="url(#light)"/>
  <!-- The architectural base connects the separate application modules. -->
  <path class="fine" d="M74 564 466 369 904 587M93 618 505 411 900 609M486 777V712M149 584V640M848 596V645"/>
  <path class="edge" d="M104 574 506 775V750L104 550Z"/>
  <path class="edge" d="M506 775 868 595V570L506 750Z"/>
  <path class="plane" d="M104 550 466 370 868 570 506 750Z"/>
  <g opacity=".45" clip-path="url(#platform-clip)"><rect x="95" y="400" width="800" height="365" fill="url(#grid)"/></g>
  <path class="route" d="m223 515 139 69 129-65 140 69 128-63"/>
  <path class="route" d="m246 440 116 58 129-64 62 31" stroke-dasharray="5 9" opacity=".6"/>
  <ellipse class="accent" cx="223" cy="515" rx="7" ry="4"/><ellipse class="sage" cx="491" cy="519" rx="7" ry="4"/><ellipse class="accent" cx="631" cy="588" rx="7" ry="4"/>
  <path class="line" d="m185 630 149 75m-133-90 44 22m542-8-148 74" opacity=".5"/>
  <!-- A compact backend card: the illustrated service behind the interface. -->
  <g transform="rotate(-9 218 308)" class="shadow">
    <rect class="panel" x="114" y="236" width="220" height="158" rx="15"/>
    <path class="line" d="M114 273H334"/>
    <circle class="accent" cx="133" cy="254" r="3"/><circle class="muted" cx="145" cy="254" r="3"/><circle class="muted" cx="157" cy="254" r="3"/>
    <text class="small" x="283" y="258">API</text>
    <path class="route" d="m149 299-12 11 12 11m133-22 12 11-12 11m-78-22-9 22"/>
    <rect class="sage" x="174" y="299" width="43" height="5" rx="2"/><rect class="muted" x="222" y="299" width="39" height="5" rx="2"/>
    <rect class="muted" x="173" y="314" width="71" height="5" rx="2"/><rect class="accent" x="173" y="330" width="29" height="5" rx="2"/><rect class="muted" x="209" y="330" width="39" height="5" rx="2"/>
    <path class="line" d="M136 359H267M136 372H228" opacity=".5"/>
  </g>
  <!-- Three service blocks with different heights, drawn in perspective. -->
  <g>
    <path class="edge" d="m159 416 66 33v53l-66-33Z"/><path class="panel" d="m225 449 45-23v53l-45 23Z"/><path class="plane" d="m159 416 45-23 66 33-45 23Z"/>
    <path class="line" d="m174 444 35 17m-35-5 35 17"/><circle class="accent" cx="252" cy="447" r="3"/>
    <path class="edge" d="m112 458 66 33v31l-66-33Z"/><path class="panel" d="m178 491 45-23v31l-45 23Z"/><path class="plane" d="m112 458 45-23 66 33-45 23Z"/>
    <path class="line" d="m128 481 34 17"/><circle class="sage" cx="207" cy="486" r="3"/>
  </g>
  <!-- The primary device is deliberately drawn rather than a project screenshot. -->
  <g transform="rotate(-11 474 359)" class="shadow">
    <path class="edge" d="M367 134h220a25 25 0 0 1 25 25v415a25 25 0 0 1-25 25H367a25 25 0 0 1-25-25V159a25 25 0 0 1 25-25Z" transform="translate(10 9)"/>
    <rect class="frame" x="342" y="134" width="270" height="465" rx="30"/>
    <rect class="screen" x="352" y="144" width="250" height="445" rx="23"/>
    <rect class="inset" x="443" y="147" width="69" height="13" rx="7"/><circle class="muted" cx="519" cy="153" r="2.5"/>
    <path class="line" d="M613 227v48M339 220v27M339 257v27"/>
    <text class="label" x="375" y="193">MOBILE</text><circle class="sage" cx="575" cy="189" r="4"/>
    <rect class="inset" x="373" y="211" width="209" height="124" rx="13"/>
    <rect class="accent" x="386" y="225" width="47" height="47" rx="13"/>
    <path d="m399 242 10-6 10 6v15l-10 6-10-6Zm0 0 10 6 10-6m-10 6v15" fill="none" stroke="#402b16" stroke-width="1.8" stroke-linejoin="round"/>
    <rect class="cream" x="445" y="230" width="101" height="6" rx="3"/>
    <rect class="muted" x="445" y="244" width="76" height="5" rx="2"/>
    <path class="line" d="M389 312 417 301 441 307 467 282 493 293 515 275 565 261" stroke="#b0ba86" stroke-width="2"/>
    <circle class="sage" cx="467" cy="282" r="3"/><circle class="accent" cx="565" cy="261" r="3"/>
    <text class="small" x="376" y="365">WORKFLOWS</text>
    <g>
      <rect class="panel" x="373" y="379" width="209" height="52" rx="10"/>
      <rect class="sage" x="386" y="390" width="28" height="28" rx="8"/><path d="m395 404 4 4 8-9" fill="none" stroke="#24321a" stroke-width="2" stroke-linecap="round"/>
      <rect class="cream" x="426" y="393" width="88" height="5" rx="2"/><rect class="muted" x="426" y="407" width="63" height="4" rx="2"/><path class="line" d="m562 399 5 5-5 5"/>
      <rect class="panel" x="373" y="441" width="209" height="52" rx="10"/>
      <rect class="muted" x="386" y="452" width="28" height="28" rx="8"/><path class="line" d="M394 461h13m-13 5h10m-10 5h8"/>
      <rect class="cream" x="426" y="455" width="98" height="5" rx="2"/><rect class="muted" x="426" y="469" width="73" height="4" rx="2"/><path class="line" d="m562 461 5 5-5 5"/>
    </g>
    <rect class="accent" x="373" y="510" width="209" height="39" rx="12"/>
    <path d="M461 530h31m-6-5 6 5-6 5" fill="none" stroke="#402b16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="line" d="M447 572h60" stroke-width="3"/>
  </g>
  <!-- A separate retail interface balances the large mobile device. -->
  <g transform="rotate(8 718 305)" class="shadow">
    <rect class="frame" x="602" y="217" width="249" height="195" rx="15"/>
    <rect class="screen" x="612" y="227" width="229" height="174" rx="8"/>
    <text class="label" x="629" y="251">POINT OF SALE</text><path class="line" d="M614 264H839"/>
    <rect class="inset" x="626" y="278" width="127" height="107" rx="5"/>
    <rect class="sage" x="637" y="290" width="44" height="36" rx="7"/><rect class="muted" x="696" y="290" width="44" height="36" rx="7"/>
    <rect class="muted" x="637" y="340" width="44" height="33" rx="7"/><rect class="accent" x="696" y="340" width="44" height="33" rx="7"/>
    <path class="line" d="m651 302 9-5 9 5v12h-18Z"/><path class="line" d="M709 301h17v15h-17Zm-2 2h21"/>
    <path class="line" d="M649 351h20m-20 6h16"/><circle cx="718" cy="356" r="8" fill="none" stroke="#563416" stroke-width="1.4"/>
    <rect class="muted" x="769" y="289" width="55" height="4" rx="2"/><rect class="muted" x="769" y="306" width="41" height="4" rx="2"/><rect class="muted" x="769" y="323" width="48" height="4" rx="2"/>
    <path class="line" d="M769 345h55"/><rect class="accent" x="769" y="360" width="55" height="23" rx="6"/>
    <path class="panel" d="m687 412-8 22h75l-8-22Z"/><path class="line" d="M663 434h106"/>
  </g>
  <!-- A paper receipt creates a contrasting, tangible business detail. -->
  <g transform="rotate(9 722 568)" class="shadow">
    <rect class="panel" x="650" y="464" width="152" height="52" rx="13"/>
    <path class="line" d="M665 485H786" stroke-width="3"/><circle class="sage" cx="785" cy="473" r="3"/>
    <path class="paper" d="M667 486h120v174l-8-5-8 5-8-5-8 5-8-5-8 5-8-5-8 5-8-5-8 5-8-5-8 5-8-5-8 5-8-5-8 5Z"/>
    <text class="dark-label" x="684" y="511">RECEIPT</text>
    <path class="paper-line" d="M682 524H771" stroke-dasharray="2 3"/>
    <rect class="paper-ink" x="682" y="539" width="45" height="4" rx="1"/><rect class="paper-ink" x="753" y="539" width="18" height="4" rx="1"/>
    <rect class="paper-ink" x="682" y="552" width="58" height="4" rx="1"/><rect class="paper-ink" x="753" y="552" width="18" height="4" rx="1"/>
    <rect class="paper-ink" x="682" y="565" width="35" height="4" rx="1"/><rect class="paper-ink" x="753" y="565" width="18" height="4" rx="1"/>
    <path class="paper-line" d="M682 582H771"/><rect class="paper-ink" x="682" y="594" width="46" height="5" rx="1"/><rect class="paper-ink" x="746" y="594" width="25" height="5" rx="1"/>
    <path d="M687 616v21m4-21v21m4-21v21m7-21v21m4-21v21m6-21v21m4-21v21m7-21v21m3-21v21m7-21v21m4-21v21m6-21v21m4-21v21m5-21v21" stroke="#6c7457" stroke-width="2"/>
  </g>
  <!-- Small navigation and connection details keep the scene original. -->
  <g transform="translate(261 170)">
    <path class="accent" d="M0 24a20 20 0 1 1 40 0c0 15-20 35-20 35S0 39 0 24Z"/>
    <circle cx="20" cy="23" r="7" fill="#30341f"/>
    <ellipse class="line" cx="20" cy="70" rx="26" ry="9"/>
  </g>
  <g transform="rotate(10 727 144)">
    <rect class="panel" x="662" y="111" width="131" height="66" rx="12"/>
    <circle class="sage" cx="685" cy="134" r="7"/><path class="line" d="M701 132h69M701 145h44"/>
    <path class="route" d="m715 163 6 4 10-10"/>
  </g>
  <path class="route" d="M756 183c54 8 85 27 92 49M261 209c-69 14-82 38-88 63" opacity=".7"/>
  <circle class="accent" cx="848" cy="232" r="4"/><circle class="sage" cx="172" cy="272" r="4"/>
  <path class="fine" d="M517 83v24m-12-12h24M856 462v20m-10-10h20M100 326v16m-8-8h16"/>
  <circle class="muted" cx="582" cy="112" r="2"/><circle class="sage" cx="890" cy="373" r="2"/><circle class="muted" cx="231" cy="613" r="2"/>
</svg>
