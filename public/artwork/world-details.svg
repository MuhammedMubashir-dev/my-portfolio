<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 780" width="960" height="780" data-mode="colour" role="img" aria-labelledby="title description">
  <title id="title">A world of connected applications</title>
  <desc id="description">An original architectural illustration of a mobile application inside an orange arch, surrounded by commerce, delivery, and software services on floating platforms.</desc>
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#47493b" /><stop offset="1" stop-color="#20251e" /></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#292e28" /><stop offset="1" stop-color="#141914" /></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b8b8a3" /><stop offset=".3" stop-color="#626956" /><stop offset="1" stop-color="#30382d" /></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#ffb373" /><stop offset=".45" stop-color="#ff8139" /><stop offset="1" stop-color="#d94d1e" /></linearGradient>
    <linearGradient id="orange-side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b33d1a" /><stop offset="1" stop-color="#76311e" /></linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4efdf" /><stop offset="1" stop-color="#c8cdb8" /></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9e0ba" stop-opacity=".12" /><stop offset="1" stop-color="#a8b897" stop-opacity=".02" /></linearGradient>
    <radialGradient id="ambient"><stop stop-color="#ff8a43" stop-opacity=".12" /><stop offset="1" stop-color="#ff8a43" stop-opacity="0" /></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="matrix(1 .5 -1 .5 0 0)"><path d="M36 0H0V36" fill="none" stroke="#acb494" stroke-opacity=".17" stroke-width="1" /></pattern>
    <clipPath id="floor"><path d="m85 547 355-177 437 218-355 177Z" /></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#000" flood-opacity=".32" /></filter>
  </defs>
  <style>
    .slab{fill:url(#stone);stroke:#68725a;stroke-width:1.4}.side{fill:#161e17;stroke:#525e48;stroke-width:1.2}.dark{fill:url(#dark);stroke:#849177;stroke-width:1.3}.frame{fill:url(#metal);stroke:#a0ab8e;stroke-width:1.3}.glass{fill:url(#glass);stroke:#95a384;stroke-width:1.2}.screen{fill:#1a241b;stroke:#7c8b6c;stroke-width:1}.orange{fill:url(#orange);stroke:#ffab70;stroke-width:1}.orange-side{fill:url(#orange-side);stroke:#e6783b;stroke-width:1}.ivory{fill:url(#ivory);stroke:#e8edda;stroke-width:1}.sage{fill:#a3b487;stroke:#c2cea6;stroke-width:1}.muted{fill:#55664c;stroke:#778567;stroke-width:.8}.ink{fill:#465440}.line{fill:none;stroke:#a8b494;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.ink-line{fill:none;stroke:#4f6048;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.route{fill:none;stroke:#ff9852;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.fine{fill:none;stroke:#a6b18c;stroke-width:1;stroke-opacity:.32}.label{fill:#dce1cc;font:500 11px ui-sans-serif,system-ui,sans-serif;letter-spacing:1.8px}.dark-label{fill:#41533c;font:600 10px ui-sans-serif,system-ui,sans-serif;letter-spacing:1.4px}.shadow{filter:url(#shadow)}
    [data-mode="outline"] .slab,[data-mode="outline"] .side,[data-mode="outline"] .dark,[data-mode="outline"] .frame,[data-mode="outline"] .glass,[data-mode="outline"] .screen,[data-mode="outline"] .orange,[data-mode="outline"] .orange-side,[data-mode="outline"] .ivory,[data-mode="outline"] .sage,[data-mode="outline"] .muted,[data-mode="outline"] .ink{fill:#111710;stroke:#c2ceb0;stroke-width:1.5}
    [data-mode="outline"] .line,[data-mode="outline"] .ink-line{stroke:#c2ceb0}[data-mode="outline"] .orange,[data-mode="outline"] .orange-side{stroke:#ffa666}[data-mode="outline"] .label,[data-mode="outline"] .dark-label{fill:#c2ceb0}[data-mode="outline"] .shadow{filter:none}[data-mode="outline"] .ambient{opacity:0}
  </style>
